# Nested rootless Podman inside the devcontainer (S2a, option B).
# No systemd or journald in the devcontainer, and /sys/fs/cgroup is read only.
[containers]
cgroups = "disabled"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"

# crun without sethostname, registered under the name "crun" so Podman's
# built-in crun capabilities (no cgroups, JSON errors) still apply.
# See .devcontainer/crun-no-hostname.
[engine.runtimes]
crun = ["/usr/local/bin/crun-no-hostname"]
